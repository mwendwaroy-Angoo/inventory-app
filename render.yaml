# Render.com infrastructure configuration
# Health-check endpoint is served at /health/ so Render's load balancer
# can warm the service instance before routing user traffic.
#
# Preboot: when a new deploy starts, Render keeps the old instance alive
# until the new one passes its health check.  This eliminates the "cold
# start" splash for free-tier apps.
#
# WARNING (confirmed wrong 2026-08-11, live dashboard screenshots): the
# `plan:` values below do NOT reflect what is actually running in
# production. The database is on "Basic-256mb" (256MB RAM / 0.1 CPU,
# $6.30/mo) and the web service is on Starter (per CLAUDE.md's own Project
# Overview) — both configured directly via the Render dashboard, not by
# syncing this file. This is the SAME config-drift pattern already
# documented in CLAUDE.md's Known Issues for the web service Start Command
# (2026-08-09/10). Never trust this file's `plan:` lines for a live
# incident — always check the Render dashboard's Info tab for each service
# directly. Left as `free` here rather than guessing at Render's current
# plan-slug naming for the newer "Basic-256mb"-style tiers, since this file
# is not being used to sync/manage the live services anyway.

databases:
  - name: duka-db
    databaseName: duka_mwecheche
    user: duka_user
    plan: free

services:
  - type: web
    name: duka-mwecheche
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn stockapp.wsgi:application --workers 1 --threads 8 --worker-class gthread --timeout 120 --log-file -"
    healthCheckPath: /health/
    preDeployCommand: "python manage.py migrate --noinput"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: stockapp.settings
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: duka-db
          property: connectionString
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
