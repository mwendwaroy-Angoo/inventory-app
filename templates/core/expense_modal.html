<!-- Ad-hoc expense modal — included on bar_board, kitchen_board. Owner/manager
     only (the including board must already gate the trigger button the same
     way). Deliberately separate from Counter Cash / PettyCash — this NEVER
     subtracts from till_expected_cash()/_reconcile(), it's a bookkeeping
     record only, backdatable to a specific day. See core/recurring_expense_
     views.py:record_ad_hoc_expense. -->
<div class="modal fade" id="expenseModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content" style="background:#2a2a2a;border:1px solid #3a3a3a;border-radius:12px;">
      <div class="modal-header" style="border-bottom:1px solid #333;">
        <h6 class="modal-title" style="color:#e89090;">💸 Matumizi</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:.85rem;">
        <div style="color:#b0b0b0;font-size:.8rem;margin-bottom:.75rem;">
          Rekodi ya matumizi ya biashara — hii HAIONDOI kwenye pesa ya kaunta
          inayotarajiwa; ni kwa ajili ya uchambuzi wa faida na hasara tu.
        </div>
        <div style="margin-bottom:.5rem;">
          <label style="color:#b0b0b0;font-size:.78rem;display:block;margin-bottom:.2rem;">Kiasi (KES)</label>
          <input type="number" id="exp-amount" min="1" step="1" placeholder="e.g. 500"
                 style="width:100%;background:#111;border:1px solid #333;border-radius:6px;color:#f0ece4;padding:.4rem .6rem;font-size:.9rem;">
        </div>
        <div style="margin-bottom:.5rem;">
          <label style="color:#b0b0b0;font-size:.78rem;display:block;margin-bottom:.2rem;">Maelezo</label>
          <input type="text" id="exp-description" placeholder="e.g. Kuni za kupikia"
                 style="width:100%;background:#111;border:1px solid #333;border-radius:6px;color:#f0ece4;padding:.4rem .6rem;font-size:.85rem;">
        </div>
        <div style="margin-bottom:.5rem;">
          <label style="color:#b0b0b0;font-size:.78rem;display:block;margin-bottom:.2rem;">Aina</label>
          <select id="exp-category" style="width:100%;background:#111;border:1px solid #333;border-radius:6px;color:#f0ece4;padding:.4rem .6rem;font-size:.85rem;">
            <option value="supplies">🧻 Vifaa</option>
            <option value="maintenance">🔧 Ukarabati</option>
            <option value="transport">🚗 Usafiri</option>
            <option value="electricity">⚡ Umeme</option>
            <option value="security">🛡 Usalama</option>
            <option value="other" selected>📝 Nyingine</option>
          </select>
        </div>
        <div style="margin-bottom:.5rem;">
          <label style="color:#b0b0b0;font-size:.78rem;display:block;margin-bottom:.2rem;">
            Tarehe <span style="color:#888;">(siku hii matumizi yalitokea)</span>
          </label>
          <input type="date" id="exp-date"
                 style="width:100%;background:#111;border:1px solid #333;border-radius:6px;color:#f0ece4;padding:.4rem .6rem;font-size:.85rem;">
        </div>
        <div style="margin-bottom:.4rem;">
          <label style="color:#b0b0b0;font-size:.78rem;display:block;margin-bottom:.2rem;">Maelezo zaidi (hiari)</label>
          <input type="text" id="exp-notes" placeholder="e.g. Risiti kutoka kwa muuzaji X"
                 style="width:100%;background:#111;border:1px solid #333;border-radius:6px;color:#f0ece4;padding:.4rem .6rem;font-size:.82rem;">
        </div>
        <div id="exp-error" style="display:none;color:#c0395a;font-size:.8rem;margin-top:.35rem;"></div>
      </div>
      <div class="modal-footer" style="border-top:1px solid #333;padding:.75rem;">
        <button id="exp-submit-btn" class="btn btn-sm w-100"
                style="background:rgba(232,144,144,.15);border:1px solid rgba(232,144,144,.4);color:#e89090;font-weight:600;"
                onclick="window._submitExpense()">
          💸 Rekodi Matumizi
        </button>
      </div>
    </div>
  </div>
</div>
