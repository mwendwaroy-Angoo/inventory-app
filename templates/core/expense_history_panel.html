<!-- Ad-hoc expense history/edit panel — included on bar_board, kitchen_board,
     owner-only (matching the record/edit permission tier). 2026-08-09 live
     request (Roy): "can i recover a counter cash entry placed on a wrong
     date mistakenly" — this is the find-it-to-fix-it panel; the actual
     correction is done via the shared expenseModal in edit mode
     (window.openExpenseModal(expense)). See core/recurring_expense_views.py:
     ad_hoc_expenses_list / edit_ad_hoc_expense. -->
<div style="margin:0 0 .75rem;">
  <button onclick="window.toggleExpenseHistory()" id="exp-history-toggle"
          style="width:100%;text-align:left;background:rgba(232,144,144,.04);border:1px solid rgba(232,144,144,.2);
                 border-radius:8px;padding:.4rem .6rem;color:#e89090;font-size:.78rem;cursor:pointer;">
    📋 Historia ya Matumizi <span id="exp-history-caret">▾</span>
  </button>
  <div id="exp-history-datebar" style="display:none;margin-top:.35rem;align-items:center;gap:.4rem;flex-wrap:wrap;">
    <span style="color:#888;font-size:.72rem;">Tarehe:</span>
    <input type="date" id="exp-history-date"
           style="background:#111;border:1px solid #444;border-radius:5px;color:#f0ece4;padding:.2rem .4rem;font-size:.75rem;"
           onchange="window.loadExpenseHistory()">
  </div>
  <div id="exp-history-panel" style="display:none;margin-top:.35rem;max-height:260px;overflow-y:auto;"></div>
</div>
