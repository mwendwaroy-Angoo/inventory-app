<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c9a84c">
    <title>Offline — Duka Mwecheche</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a1a;
            color: #f0ece4;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 400px; }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            color: #c9a84c;
            font-size: 1.5rem;
            margin-bottom: 0.8rem;
        }
        p {
            color: #888;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #8b1a35, #c0395a);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Couldn't Reach Duka Mwecheche</h1>
        <p id="offlineMsg">
            This could be your connection, or a brief hiccup reaching our
            server — not necessarily that you're offline. Some features may
            still be available from cache.
        </p>
        <p id="retryStatus" style="color:#c9a84c; font-size:0.85rem; margin-top:-0.8rem; margin-bottom:1.5rem;">
            Checking connection&hellip;
        </p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>
    <script>
        // 2026-08-11 live report (Roy): the old "You've lost your internet
        // connection" message was confidently wrong whenever this page was
        // reached because of something OTHER than the user's own internet
        // being down (a DNS/TLS hiccup or a slow response reaching this
        // specific server, while every other site — YouTube in the reported
        // case — worked fine). This page no longer just sits there waiting
        // for a manual tap: it quietly polls the lightweight, unauthenticated
        // /health/ endpoint in the background and auto-reloads the instant a
        // real connection to the server succeeds, so most users never need
        // to tap "Try Again" at all.
        (function () {
            var statusEl = document.getElementById('retryStatus');
            var attempts = 0;

            function checkAndRetry() {
                attempts += 1;
                var controller = new AbortController();
                var timeoutId = setTimeout(function () { controller.abort(); }, 4000);
                fetch('/health/', { cache: 'no-store', signal: controller.signal })
                    .then(function (resp) {
                        clearTimeout(timeoutId);
                        if (resp.ok) {
                            statusEl.textContent = 'Back online — reloading…';
                            window.location.reload();
                        } else {
                            statusEl.textContent = 'Still trying to reconnect…';
                        }
                    })
                    .catch(function () {
                        clearTimeout(timeoutId);
                        statusEl.textContent = attempts > 1
                            ? 'Still trying to reconnect… (attempt ' + attempts + ')'
                            : 'Still trying to reconnect…';
                    });
            }

            checkAndRetry();
            setInterval(checkAndRetry, 5000);
        })();
    </script>
</body>
</html>
